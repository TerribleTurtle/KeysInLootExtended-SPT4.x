changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
  categories:
    - title: Features & Enhancements
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Maintenance & Refactoring
      labels:
        - refactor
        - maintenance
        - dependencies
    - title: Other Changes
      labels:
        - "*"

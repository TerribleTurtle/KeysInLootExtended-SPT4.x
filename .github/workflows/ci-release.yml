name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]*"
      - "v[0-9]+.[0-9]+.[0-9]*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Overwrite existing GitHub Release if version already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Verify Package (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: |
          dotnet restore ./KeysInLootExtended/KeysInLootExtended.csproj
          dotnet restore ./KeysInLootExtended.Tests/KeysInLootExtended.Tests.csproj

      - name: Build Mod (Release)
        run: dotnet build ./KeysInLootExtended/KeysInLootExtended.csproj -c Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test ./KeysInLootExtended.Tests/KeysInLootExtended.Tests.csproj -c Release --no-restore

      - name: Verify Release Zip Packaging
        shell: pwsh
        run: |
          ./release.ps1 -PackageOnly
          Remove-Item -Path "KeysInLootExtended-*.zip" -Force

  release:
    name: Package & Publish Release
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check Version & Publish Release
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_OVERWRITE: ${{ inputs.overwrite }}
        run: |
          $ErrorActionPreference = "Stop"
          $csprojPath = "./KeysInLootExtended/KeysInLootExtended.csproj"
          [xml]$project = Get-Content -LiteralPath $csprojPath -Raw -Encoding UTF8
          $versionNode = $project.SelectSingleNode("/Project/PropertyGroup/Version")
          $version = if ($null -ne $versionNode) { $versionNode.InnerText.Trim() } else { "" }
          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Could not find <Version> in $csprojPath"
          }

          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF.StartsWith("refs/tags/")) {
              $releaseTag = $env:GITHUB_REF.Substring("refs/tags/".Length)
              $normalizedTag = if ($releaseTag.StartsWith("v")) { $releaseTag.Substring(1) } else { $releaseTag }
              if ($normalizedTag -ne $version) {
                  throw "Pushed git tag '$releaseTag' does not match <Version> '$version' in $csprojPath."
              }
          } else {
              $releaseTag = $version
          }

          Write-Host "Target version: $version (release tag: $releaseTag)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try {
              & gh @("release", "view", $releaseTag) *> $null
              $releaseExists = ($LASTEXITCODE -eq 0)
          } finally {
              $ErrorActionPreference = $prevEap
          }

          if ($releaseExists -and $env:FORCE_OVERWRITE -ne "true") {
              Write-Host "Release '$releaseTag' already exists and overwrite is not enabled. Skipping publish."
              "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
          }

          if ($releaseExists) {
              Write-Host "Release '$releaseTag' exists and overwrite=true; running release.ps1 -Overwrite..."
              ./release.ps1 -TagName $releaseTag -Overwrite
          } else {
              Write-Host "Publishing new release '$releaseTag' via release.ps1..."
              ./release.ps1 -TagName $releaseTag
          }

          "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: VirusTotal Scan
        id: vt
        if: steps.package.outputs.published == 'true' && env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            KeysInLootExtended-${{ steps.package.outputs.version }}.zip

      - name: Ensure VirusTotal Analysis Link in Release Body
        if: steps.package.outputs.published == 'true' && steps.vt.outputs.analysis != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          $ErrorActionPreference = "Stop"
          $currentBody = & gh @("release", "view", $env:RELEASE_TAG, "--json", "body", "--jq", ".body")
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to read release body for '$($env:RELEASE_TAG)'"
          }
          if ($currentBody -match "virustotal\.com") {
              Write-Host "Release body already contains VirusTotal analysis link."
              exit 0
          }
          $links = @()
          foreach ($entry in ($env:VT_ANALYSIS -split ",")) {
              $parts = $entry -split "=", 2
              if ($parts.Count -eq 2 -and -not [string]::IsNullOrWhiteSpace($parts[1])) {
                  $links += "  * [``$($parts[0].Trim())``]($($parts[1].Trim()))"
              }
          }
          if ($links.Count -eq 0) {
              exit 0
          }
          $vtSection = "`n`n🛡 [VirusTotal GitHub Action](https://github.com/crazy-max/ghaction-virustotal) analysis:`n" + ($links -join "`n")
          $updatedBody = ([string]$currentBody).TrimEnd() + $vtSection + "`n"
          $tempBody = Join-Path ([System.IO.Path]::GetTempPath()) "kil_vt_notes_$([Guid]::NewGuid().ToString('N')).md"
          try {
              [System.IO.File]::WriteAllText($tempBody, $updatedBody, [System.Text.UTF8Encoding]::new($false))
              & gh @("release", "edit", $env:RELEASE_TAG, "--notes-file", $tempBody)
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to append VirusTotal analysis link to release '$($env:RELEASE_TAG)'"
              }
          } finally {
              if (Test-Path -LiteralPath $tempBody) {
                  Remove-Item -LiteralPath $tempBody -Force -ErrorAction SilentlyContinue
              }
          }

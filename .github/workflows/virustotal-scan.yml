name: VirusTotal Release Scan

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  scan:
    name: Scan Release Assets
    if: github.actor != 'github-actions[bot]' && !contains(github.event.release.body, 'virustotal.com')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to update the release body with scan results
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Download Release Assets
        if: env.VT_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir release-assets

      - name: VirusTotal Scan
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          update_release_body: true
          files: |
            release-assets/*.zip
